name: Land a bot pull request
description: >-
  Open (or update) a pull request with the working tree's changes on a fixed
  branch, run the repo's CI on it, and squash-merge it only when that run is
  green on the PR's head commit.

# WHY ONE ACTION
# --------------
# The family has three automations that open a PR with the default
# GITHUB_TOKEN and merge it themselves: the reusable kit-pin bump and
# BearsMockDraft's two data-refresh crons. Each used to carry its own copy of
# these steps, and the copies drifted: when branch protection went on
# (2026-11-02) the bump got a CI gate the same afternoon and the two crons did
# not, so both stopped landing data the next morning (BearsMockDraft #234,
# #236). One copy means the next fix lands once.
#
# WHAT IT RUNS
# ------------
# Nothing from the caller's repository. It reads the PR and the caller's
# workflow files, calls the GitHub API through `gh`, and runs
# create-pull-request. The CI it dispatches runs under the CI workflow's own
# token. So it is safe in a job holding contents + pull-requests write, which
# is the only kind of job that can use it.
#
# The caller's job must grant `contents: write`, `pull-requests: write` and
# `actions: write` (the dispatch), and must already have the changes in its
# working tree.
#
# WHO OPENS AND MERGES THE PR (2026-11-05)
# ----------------------------------------
# Under the family branch protection (since 2026-11-02) GitHub refuses every
# merge made with the default token, even with a signed commit and both
# required checks green on the head (Netlify-kit #59, BearsMockDraft #236).
# So a caller that holds the family GitHub App's two secrets
# (FAMILY_BOT_APP_ID, FAMILY_BOT_PRIVATE_KEY) passes them as `app-id` and
# `app-private-key`, and the PR is opened and merged with an installation
# token minted here for THIS repository alone, with contents and
# pull-requests write and nothing more. No `workflows` permission, so a change
# to .github/workflows/ is refused at the push exactly as it is under the
# default token. The token is revoked when the job ends.
#
# A caller with neither keeps the default token and the outcome it has today:
# a refused merge reds the run and leaves the green PR open for a session or
# the owner (vendor-cli's MAINTENANCE.md, FAM-1 (b)). One secret without the
# other is a misconfiguration and fails the run before anything is opened.
# The CI dispatch and the wait always use the default token, whichever
# identity opens the PR.
#
# The private key can mint a token for every repository the App is installed
# on (all of them), so it belongs ONLY in a job that has run nothing from the
# repository before this action: a step earlier in the same job can rewrite
# this action's files on the runner's disk before they execute. That is
# kit-pin-bump.yml's `bump` job and BearsMockDraft's refresh `land` jobs;
# test/workflows.test.mjs holds the first.
#
# Tested by test/land-bot-pr.test.mjs, which runs the CI and merge steps' real
# scripts against a fake `gh`, and test/workflows.test.mjs.

inputs:
  token:
    description: >-
      The default token. It always dispatches CI and reads the run, and it
      opens and merges the PR when no App is configured. Leave it as the
      default GITHUB_TOKEN: commit signing works only with a bot token, and a
      PAT makes unsigned commits.
    default: ${{ github.token }}
  app-id:
    description: >-
      The family GitHub App's ID (the repo secret FAMILY_BOT_APP_ID). With
      app-private-key, the PR is opened and merged as the App, under a token
      for this repository alone. Both empty keeps the default token; one
      without the other fails the run.
    default: ''
  app-private-key:
    description: >-
      The family GitHub App's private key (the repo secret
      FAMILY_BOT_PRIVATE_KEY). Pass it only from a job that ran nothing from
      the repository before this action; see the header.
    default: ''
  branch:
    description: The fixed branch the PR is opened from, e.g. auto/kit-pin-bump.
    required: true
  add-paths:
    description: >-
      Newline-separated paths (globs allowed) that may ride the PR. Empty takes
      every change in the working tree.
    default: ''
  commit-message:
    description: The commit message.
    required: true
  title:
    description: The pull request title.
    required: true
  body:
    description: The pull request body.
    default: ''
  ci-workflow:
    description: >-
      The CI workflow file to dispatch, e.g. ci.yml. Empty finds the one
      workflow that calls family-ci.yml and has workflow_dispatch.
    default: ''
  ci-wait-minutes:
    description: How long to wait for that CI run before giving up.
    default: '40'
  auto-merge:
    description: >-
      'true' merges a PR whose CI is green. 'false' only dispatches CI, so a
      human finds the required checks already there.
    default: 'true'
  soft-fail:
    description: >-
      'true' turns a red or unfinished CI run, or a refused merge, into a
      warning. The PR is never merged on one.
    default: 'false'
  stuck-note:
    description: >-
      The sentence a refused merge appends to its error: what goes stale while
      the PR sits open.
    default: ''

outputs:
  identity:
    description: "'app' when the family App opened and merged the PR, 'default' when the default token did."
    value: ${{ steps.identity.outputs.identity }}
  pull-request-number:
    description: The PR's number; empty when there was nothing to open.
    value: ${{ steps.cpr.outputs.pull-request-number }}
  pull-request-url:
    description: The PR's URL; empty when there was nothing to open.
    value: ${{ steps.cpr.outputs.pull-request-url }}
  head-sha:
    description: The PR head commit the CI run was dispatched for.
    value: ${{ steps.ci.outputs.head-sha }}
  merged:
    description: "'true' only when this run merged the PR."
    value: ${{ steps.merge.outputs.merged }}
  merge-sha:
    description: The squash commit the merge put on the default branch; empty when nothing merged.
    value: ${{ steps.merge.outputs.merge-sha }}

runs:
  using: composite
  steps:
    # A repo holding one of the two secrets meant to hold both. Falling back to
    # the default token there would end in the refused merge the App exists to
    # avoid, with nothing saying why, so it fails first. The condition reads
    # only whether each input is empty; the key never reaches a shell.
    - name: Refuse a half-configured family App
      id: app-check
      if: (inputs.app-id == '') != (inputs.app-private-key == '')
      shell: bash
      run: |
        echo "::error::Only one of FAMILY_BOT_APP_ID and FAMILY_BOT_PRIVATE_KEY reached land-bot-pr. Set both as repository secrets (and pass both from the caller), or neither to keep the default token."
        exit 1

    # First-party, so referenced by major tag (the family pinning policy).
    # The token covers this repository only: no owner or repositories input,
    # though the App is installed on every family repo. Exactly the two
    # permissions opening and merging a PR take; asking for no `workflows`
    # keeps a .github/workflows/ change unpushable, as under the default token.
    - name: Mint the family App's token for this repository
      id: app
      if: inputs.app-id != '' && inputs.app-private-key != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-contents: write
        permission-pull-requests: write

    # Which identity this run lands as, in the log and as an output: the one
    # place a reader of the run page can see whether the repo's secrets
    # reached the action.
    - name: Say who opens and merges the PR
      id: identity
      shell: bash
      env:
        MINTED: ${{ steps.app.outcome }}
        APP_SLUG: ${{ steps.app.outputs.app-slug }}
      run: |
        if [ "$MINTED" = "success" ]; then
          echo "identity=app" >> "$GITHUB_OUTPUT"
          echo "The PR is opened and merged as the family App (${APP_SLUG:-unnamed}), with a token for this repository alone."
        else
          echo "identity=default" >> "$GITHUB_OUTPUT"
          echo "No family App secrets reached this action, so the PR is opened and merged with the default token. Under the family branch protection that merge is refused (FAM-1 (b))."
        fi

    - name: Open a pull request
      id: cpr
      # Pinned by SHA, not tag: this runs in jobs with contents and
      # pull-requests write, and a version tag (`v8`, `v8.1.1`) is movable on
      # a third-party account. Bump the SHA deliberately, with the version it
      # resolves to in the trailing comment.
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        # The App's token when one was minted, else the default token.
        token: ${{ steps.app.outputs.token || inputs.token }}
        # Signed, so a commit-signature rule is never what refuses the merge:
        # the commit is made through the GitHub API, which GitHub signs as the
        # token's bot (github-actions[bot], or the App's bot; it ignores author
        # / committer, and refuses a file over 40 MiB). A push made with the
        # App's token also fires the repo's pull_request CI, which the default
        # token's never did. The dispatch below still runs and its result is
        # what decides the merge, but the merge also waits for this run to
        # finish, because branch protection reads its checks too.
        sign-commits: true
        branch: ${{ inputs.branch }}
        add-paths: ${{ inputs.add-paths }}
        commit-message: ${{ inputs.commit-message }}
        title: ${{ inputs.title }}
        body: ${{ inputs.body }}

    # Dispatch the repo's CI on the PR's branch and wait for it on the head
    # commit. A PR opened with the default token gets no pull_request CI (its
    # run waits for an approval nobody gives), and workflow_dispatch is the one
    # event that token may still fire. With auto-merge off it only dispatches.
    # Always the default token, App or not: it needs actions: write, which the
    # caller's job grants and the App's token is not given.
    #
    # Gated on the PR NUMBER, not on pull-request-operation: a re-run after a
    # refused merge, with nothing upstream changed, rebuilds a byte-identical
    # branch, which create-pull-request reports as operation 'none' while still
    # naming the open PR. A created/updated gate skipped the merge there and
    # went green with the PR left open (BearsMockDraft #209).
    - name: Run the repo's CI on the PR branch
      id: ci
      if: steps.cpr.outputs.pull-request-number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        BRANCH: ${{ inputs.branch }}
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        WAIT_MINUTES: ${{ inputs.ci-wait-minutes }}
        AUTO_MERGE: ${{ inputs.auto-merge }}
        SOFT_FAIL: ${{ inputs.soft-fail }}
        IDENTITY: ${{ steps.identity.outputs.identity }}
        POLL_SECONDS: '20'
      run: |
        set -euo pipefail
        head=$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')
        if [ ${#head} -ne 40 ] || [ -n "${head//[0-9a-f]/}" ]; then
          echo "::error::Could not read the head commit of $PR_URL (got '$head')."
          exit 1
        fi
        echo "head-sha=$head" >> "$GITHUB_OUTPUT"

        wf="$CI_WORKFLOW"
        if [ -z "$wf" ]; then
          mapfile -t found < <(grep -lE 'uses:[[:space:]]*(jsvolos63/vendor-cli/|\./)\.github/workflows/family-ci\.ya?ml' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null \
                                 | xargs -r grep -lE '^[[:space:]]*workflow_dispatch:' || true)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one workflow in .github/workflows that calls family-ci.yml and has workflow_dispatch; found ${#found[@]}${found[*]:+: ${found[*]}}. Pass ci-workflow to name it."
            exit 1
          fi
          wf=$(basename "${found[0]}")
        fi
        if ! [[ "$wf" =~ ^[A-Za-z0-9._-]+\.ya?ml$ ]]; then
          echo "::error::ci-workflow must be a workflow file name like ci.yml (got '$wf')."
          exit 1
        fi

        # Runs created before this dispatch are not this dispatch's; the
        # minute of slack covers runner/GitHub clock skew (a run that old on
        # the same head commit validated the same tree anyway).
        since=$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%SZ)
        gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
        echo "Dispatched $wf on $BRANCH ($head)."
        if [ "$AUTO_MERGE" != "true" ]; then
          echo "auto-merge is off: the checks will be on $PR_URL for whoever merges it."
          exit 0
        fi

        deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
        # A poll that fails (a 502, a secondary rate limit) is retried, not
        # fatal: this wait makes a call every POLL_SECONDS for up to
        # ci-wait-minutes, and under `set -e` one transient error used to end
        # the step with the green PR left open and only gh's message in the
        # log. MAX_POLL_FAILURES in a row still fail it, so a revoked token or
        # a wrong path is not hidden for the whole wait. A failed poll is
        # never read as an answer: in the App wait below an empty answer
        # means "nothing unfinished", which would merge early.
        poll_failures=0
        max_poll_failures=${MAX_POLL_FAILURES:-5}
        poll_failed() {
          poll_failures=$((poll_failures + 1))
          echo "::warning::Reading the CI runs on $head failed ($poll_failures in a row); retrying."
          if [ "$poll_failures" -ge "$max_poll_failures" ]; then
            echo "::error::Reading the CI runs on $head failed $poll_failures times in a row; $PR_URL is left open."
            exit 1
          fi
          sleep "$POLL_SECONDS"
        }
        run=''
        while :; do
          if ! run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$head&event=workflow_dispatch&per_page=20" \
                  --jq "[.workflow_runs[] | select(.created_at >= \"$since\")] | sort_by(.created_at) | last | select(. != null) | [.id, .status, (.conclusion // \"\"), .html_url] | @tsv"); then
            poll_failed; continue
          fi
          poll_failures=0
          status=$(cut -f2 <<<"$run")
          if [ "$status" = "completed" ]; then break; fi
          if [ "$(date +%s)" -ge "$deadline" ]; then
            msg="CI ($wf) on $BRANCH did not finish within $WAIT_MINUTES minutes${run:+ (last seen: $status, $(cut -f4 <<<"$run"))}; $PR_URL is left open."
            if [ "$SOFT_FAIL" = "true" ]; then echo "::warning::$msg"; echo "green=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "::error::$msg"
            exit 1
          fi
          sleep "$POLL_SECONDS"
        done
        conclusion=$(cut -f3 <<<"$run")
        url=$(cut -f4 <<<"$run")
        if [ "$conclusion" = "success" ]; then
          # An App-opened PR's push also fired pull_request CI on this commit.
          # Its check runs carry the same names as this run's, so branch
          # protection reads the required checks as pending until it finishes
          # too, and gh refuses the merge however green this run is. Weather
          # #178 lost that race by seconds with both runs on their way to
          # green; Netlify-kit #63 won it on the luck of a 20-second poll. No
          # event filter and no `since`, because any unfinished run on this
          # head holds the checks. Not for the default token: its PR has no
          # such run, only one parked on an approval nobody gives.
          if [ "${IDENTITY:-}" = "app" ]; then
            while :; do
              if ! busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$head&per_page=20" \
                       --jq "[.workflow_runs[] | select(.status != \"completed\")] | sort_by(.created_at) | last | select(. != null) | [.status, .html_url] | @tsv"); then
                poll_failed; continue
              fi
              poll_failures=0
              if [ -z "$busy" ]; then break; fi
              echo "Waiting for another CI run on $head: $(cut -f2 <<<"$busy")"
              if [ "$(date +%s)" -ge "$deadline" ]; then
                msg="Another CI run ($wf) on $BRANCH's head commit did not finish within $WAIT_MINUTES minutes (last seen: $(cut -f1 <<<"$busy"), $(cut -f2 <<<"$busy")). Branch protection reads its checks too, so $PR_URL is left open."
                if [ "$SOFT_FAIL" = "true" ]; then echo "::warning::$msg"; echo "green=false" >> "$GITHUB_OUTPUT"; exit 0; fi
                echo "::error::$msg"
                exit 1
              fi
              sleep "$POLL_SECONDS"
            done
            # One more poll's worth of time for GitHub to recompute the PR's
            # merge state from the checks that just finished.
            sleep "$POLL_SECONDS"
          fi
          echo "green=true" >> "$GITHUB_OUTPUT"
          echo "CI passed on $head: $url"
          exit 0
        fi
        msg="CI ($wf) concluded '$conclusion' on $BRANCH's head commit $head: $url — $PR_URL is left open. Fix the failure or merge by hand once it is green."
        if [ "$SOFT_FAIL" = "true" ]; then echo "::warning::$msg"; echo "green=false" >> "$GITHUB_OUTPUT"; exit 0; fi
        echo "::error::$msg"
        exit 1

    # Squash-merge the validated PR, bound to the commit CI passed; the branch
    # is deleted so the next run starts clean. A refused merge FAILS the step:
    # a validated PR left unmerged is a record that quietly stops updating,
    # so it must be a red run, not a warning (soft-fail: 'true' makes it one).
    - name: Merge the validated PR
      id: merge
      if: inputs.auto-merge == 'true' && steps.cpr.outputs.pull-request-number != ''
      shell: bash
      env:
        # The same identity that opened the PR merges it.
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.token }}
        IDENTITY: ${{ steps.identity.outputs.identity }}
        PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        SOFT_FAIL: ${{ inputs.soft-fail }}
        STUCK_NOTE: ${{ inputs.stuck-note }}
        CI_GREEN: ${{ steps.ci.outputs.green }}
        HEAD_SHA: ${{ steps.ci.outputs.head-sha }}
      run: |
        # Reached with CI not green only under soft-fail (otherwise the CI
        # step already failed the job): leave the PR open, say so.
        if [ "$CI_GREEN" != "true" ]; then
          echo "::warning::CI is not green on the PR branch — $PR_URL left open."
          exit 0
        fi
        # Bound to the commit CI validated: a push landing in between is
        # refused by GitHub rather than merged unvalidated.
        if gh pr merge --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR_URL"; then
          echo "PR merged: $PR_URL"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          # Name the squash commit for a caller that tags it (the kit-pin
          # bump's release job). `gh pr view` says exactly which commit
          # landed, where "the head of the default branch now" would race
          # whatever merged next, and GitHub fills mergeCommit a moment after
          # the merge returns, so read it more than once before giving up.
          SHA=''
          for _ in 1 2 3; do
            CANDIDATE=$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid // ""' || echo '')
            if [ ${#CANDIDATE} -eq 40 ] && [ -z "${CANDIDATE//[0-9a-f]/}" ]; then
              SHA="$CANDIDATE"
              break
            fi
            sleep 3
          done
          if [ -n "$SHA" ]; then
            echo "merge-sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "Merged as $SHA"
          else
            # Loud, but not fatal: the PR itself landed, and failing the run
            # here would report the merge as broken when only the tag is.
            echo "::error::Merged $PR_URL but could not read its squash commit, so a caller that tags it will not. Dispatch the repo's Release workflow to tag it."
          fi
        else
          if [ "$IDENTITY" = "app" ]; then
            who="the family App's merge was refused: the branch protection or ruleset on the default branch must let the App merge a PR with green checks, or a conflict or permissions gap is in the way"
          else
            who="branch protection, a conflict, or a permissions gap; the merge used the default token because no family App secrets reached the action (FAMILY_BOT_APP_ID, FAMILY_BOT_PRIVATE_KEY)"
          fi
          if [ "$SOFT_FAIL" = "true" ]; then
            echo "::warning::Auto-merge failed ($who) — review and merge manually: $PR_URL"
          else
            echo "::error::Auto-merge of the validated PR failed ($who). It is stuck at $PR_URL, green: merge it by hand or fix the blocker.${STUCK_NOTE:+ $STUCK_NOTE}"
            exit 1
          fi
        fi
