# Kit pin bump — the @jfs family's reusable pin-bump workflow (workflow_call).
#
# The consumer half of the kit-update fan-out: check whether the pinned
# @jfs/* kits have moved past the caller's pins, and if so open a PR with the
# bumped pins + regenerated vendored copies. The workflow patch-bumps the app
# version for the re-vendored assets, runs the repo's CI checks itself in a
# read-only job, then DISPATCHES the repo's own family-ci workflow on the bump
# branch and merges the PR only once that run is green on its head commit — a
# kit fix propagates with zero manual touches. It never pushes directly to the
# default branch.
#
# Why the dispatch (2026-11-02): main is branch-protected and REQUIRES the
# family-ci checks. A PR opened with the default GITHUB_TOKEN never triggers
# pull_request workflows, so before this the bump PR carried no check runs at
# all and its merge was refused. workflow_dispatch is the one event a
# GITHUB_TOKEN may still fire, and the check runs it creates sit on the PR's
# head commit under the same names (`family-ci / checks`), which is what the
# protection rule matches. It needs `actions: write`, which every caller must
# grant (a called workflow cannot elevate its token).
#
# Eight consumer repos used to hand-copy this ~104-line skeleton and the
# copies drifted (8 distinct files differing only in install/check/version
# commands). Worse, the copies demoted a failed auto-merge to an invisible
# `::warning::` — which is how kit pins silently drifted across the family.
# This reusable workflow FAILS the run when the merge of a validated bump is
# blocked, so a stuck bump shows up as a red workflow run (set `soft-fail:
# true` to get the old warning-only behavior back).
#
# Callers keep only the schedule and the repo-specific commands. The family
# schedule is monthly, on the 2nd at ~06:41 UTC (news-kit at ~06:11, so the
# apps pick up its bump the same morning) — the owner's decision of
# 2026-11-01, which moved every caller off the old Monday cron:
#
#   name: Kit pin bump
#   on:
#     schedule:
#       - cron: '41 6 2 * *'
#     workflow_dispatch:
#   permissions: {}            # nothing by default; the job asks for its own
#   jobs:
#     bump:
#       permissions:
#         contents: write
#         pull-requests: write
#         actions: write       # dispatch the repo's CI on the bump branch
#       # Pinned to a release's commit, never `@main` (FAM-2): the write
#       # token and the App key below go to exactly this code. Dependabot's
#       # github-actions entry rolls the pin to the next tag.
#       uses: jsvolos63/vendor-cli/.github/workflows/kit-pin-bump.yml@<sha> # vX.Y.Z
#       # The family App's two secrets, by name (never `secrets: inherit`,
#       # which would hand this workflow every secret the repo holds). A repo
#       # that does not hold them passes empty values and keeps the default
#       # token.
#       secrets:
#         FAMILY_BOT_APP_ID: ${{ secrets.FAMILY_BOT_APP_ID }}
#         FAMILY_BOT_PRIVATE_KEY: ${{ secrets.FAMILY_BOT_PRIVATE_KEY }}
#       with:
#         check-command: |
#           npm run check
#           npm test
#
# A caller whose repo has a Release workflow ALSO passes the title that
# workflow uses:
#
#         release-title: 'Weather Maps'
#
# and the version this bump lands gets tagged. Without it the bump merges and
# the tag never happens: the merge is made with the default GITHUB_TOKEN, which
# fires no push workflows, so the repo's CI never runs on the merged commit and
# release.yml — gated on that CI run — never fires. Measured on 2026-09-22:
# fifteen versions had landed on main untagged that way, every one of them a
# Monday pin bump (Weather 6, Art-Gallery- 3, John's News 2, market-monitor 2,
# Surf-Tracker 2). (A merge made as the family App fires CI on main and so
# tags through the ordinary path too; the release job below is what covers a
# repo without the App's secrets.)
#
# A KIT caller (a repo with no vendor:sync and no version:stamp — its semver
# tracks index.js + bin) must ALSO pass:
#
#         vendor-sync-command: npm install   # keep package-lock in step with the pin
#         version-bump-command: ''
#
# Left at the defaults, the run dies on `Missing script: "vendor:sync"` —
# which three kits did every Monday for two weeks before anyone looked, so
# their vendor-cli pins sat three minors behind while every consumer vendored
# those kits through the stale CLI resolved from inside them.
#
# The caller MUST grant `contents: write` + `pull-requests: write` — a
# called workflow can never elevate beyond what the caller passes. The
# default github.token runs everything except, where the repo holds the
# family GitHub App's secrets (FAMILY_BOT_APP_ID, FAMILY_BOT_PRIVATE_KEY),
# opening and merging the bump PR: under the family branch protection
# (2026-11-02) GitHub refuses every merge the default token makes, so only a
# repo with the secrets lands its bump by itself. The caller passes the two
# by name; nothing else is forwarded.
#
# TWO JOBS, ON PURPOSE, AND THE SPLIT IS THE SECURITY BOUNDARY. Everything
# that executes code nobody reviewed — `npm install` of kit commits resolved
# seconds ago (their lifecycle scripts), the kits' own vendor CLIs in
# vendor-sync, and the caller's check-command, which imports the freshly
# vendored copies — runs in `prepare`, whose token is downgraded to
# `contents: read`. It hands the bumped tree to `bump` as a git patch
# artifact. `bump` holds the write token and executes NOTHING from the repo:
# checkout, apply the patch, open the PR, merge. So a compromised kit commit
# (or a compromised dependency of one) landing in the monthly bump can at
# worst ship itself in the PR it was always going to ride — it cannot push
# to the default branch, touch other branches, or approve anything. Before
# the split (2026-09-26) the single job ran that code with the write token
# in its environment; the family security audit rated it the family's
# largest blast radius (FAM-1).
#
# THE WRITE JOB RUNS THIS REPO'S ACTION AT THIS WORKFLOW'S OWN COMMIT
# (2026-11-13, FAM-2). It used to call `land-bot-pr@main` — so even a caller
# pinned to a release would have handed its write token and the App key to
# whatever vendor-cli's main held that day. Now the job reads the commit it
# was called at off the caller's own `uses:` line (the `github` context is
# the caller's and names no called commit; the OIDC claim that does would
# cost every caller `id-token: write`), checks vendor-cli out there, and
# calls the action from that checkout. The one call that cannot work that
# way, the nested `release.yml` below, is pinned by SHA instead.
#
# One place to fix the flow for every consumer. Treat edits here like kit
# API changes: they land in every repo's next scheduled bump at once.
name: Kit pin bump

on:
  workflow_call:
    outputs:
      merge-sha:
        description: >-
          The commit the bump's squash-merge put on the default branch — empty
          when nothing merged (no pin moved, auto-merge off, or the merge was
          blocked). A caller that runs its own CI on the merged commit gates on
          it (`if: needs.<job>.outputs.merge-sha != ''`) instead of firing on
          every run, merged or not; market-monitor's `ci-on-main` asked for it.
        value: ${{ jobs.bump.outputs.merge-sha }}
    # The family GitHub App's two secrets, which a caller passes by name (see
    # the caller example above). Both optional: a caller that passes neither,
    # or a repo that holds neither, keeps the default token and today's
    # outcome. Only the `bump` job reads them; `prepare`, which runs the code
    # nobody reviewed, never references them, so they never reach its runner.
    secrets:
      FAMILY_BOT_APP_ID:
        description: The family GitHub App's ID. With the key, the bump PR is opened and merged as the App.
        required: false
      FAMILY_BOT_PRIVATE_KEY:
        description: The family GitHub App's private key.
        required: false
    inputs:
      node-version:
        description: Node.js version to set up. Ignored when node-version-file is set.
        type: string
        default: '22'
      node-version-file:
        description: >-
          Path to a .nvmrc / .node-version in the CALLING repo, the same
          opt-in family-ci.yml has: when set, that file decides the Node the
          bump runs on and `node-version` is ignored, so a repo whose CI
          already reads its .nvmrc does not validate its bump on a
          different Node than its CI and its deploy. Default '' keeps
          `node-version` authoritative — a no-op for every caller that does
          not set it. The file must exist; setup-node fails rather than
          falling back.
        type: string
        default: ''
      install-command:
        description: >-
          Dependency install command (jfs-bump-kit-pins ships in
          @jfs/vendor-cli, so deps must be installed before it can run). The
          default runs no package's install scripts (`--ignore-scripts`) —
          this job installs kit commits resolved seconds ago, and a git
          dependency's `prepare` script is exactly the code nobody reviewed.
          A repo whose dependency needs its install script (a native build)
          passes its own command, and says why beside it.
        type: string
        default: npm ci --ignore-scripts
      vendor-sync-command:
        description: >-
          Commands that regenerate the vendored copies from the bumped pins
          ('' skips — for copy-in consumers with no vendor:sync). The default
          re-installs first so the newly pinned kit commits are what gets
          vendored — again with no install scripts.
        type: string
        default: |
          npm install --ignore-scripts
          npm run vendor:sync
      version-bump-command:
        description: >-
          Commands that bump the app version for the re-vendored shipped
          assets ('' skips). Repos whose version source of truth is not
          package.json override this with their own rewrite.
        type: string
        default: |
          npm version patch --no-git-tag-version
          npm run version:stamp
      claude-md-sync-command:
        description: >-
          Commands that re-sync the CLAUDE.md family-conventions block from
          the freshly installed @jfs/vendor-cli ('' skips). The default
          re-installs first so the sync reads the canonical text at the
          BUMPED pin — running the pinned-but-stale copy could regress the
          block, which is worse than not syncing.
        type: string
        default: |
          npm install --ignore-scripts
          npx --no-install jfs-claude-md-sync
      maintenance-sync-command:
        description: >-
          Commands that re-sync the MAINTENANCE.md family-maintenance block
          from the @jfs/vendor-cli the CLAUDE.md step above just installed
          ('' skips). The default does nothing in a repo with no
          MAINTENANCE.md — jfs-maintenance-sync refuses to create one, on
          purpose. Same reason as the CLAUDE.md step: family CI checks the
          block against vendor-cli main, so an edit to the canonical text
          must reach every consumer, and this is its backstop.
        type: string
        default: |
          if [ -f MAINTENANCE.md ]; then npx --no-install jfs-maintenance-sync; fi
      check-command:
        description: >-
          The repo's CI checks, run against the bumped tree before the PR is
          merged ('' skips — only sensible for pins-only repos that leave the
          PR for a human via auto-merge: false). Required so every caller
          states its validation explicitly.
        type: string
        required: true
      auto-merge:
        description: Squash-merge the validated PR automatically ('false'
          leaves it open for a human)
        type: boolean
        default: true
      soft-fail:
        description: >-
          If auto-merge is blocked (branch protection, conflict), emit the
          legacy '::warning::' instead of failing the job. Default false —
          a stuck bump should be loud, not a warning nobody reads.
        type: boolean
        default: false
      release-title:
        description: >-
          Release title prefix for the version this bump lands — the same
          string the repo's own Release workflow passes as `title`, so a tag
          reads the same however it was made. '' skips the release job, which
          is right for a repo with no Release workflow. Harmless when the
          version did not move: release.yml exits 0 on a tag that exists.
        type: string
        default: ''
      pr-body-extra:
        description: Extra Markdown appended to the PR body (e.g. manual
          re-vendor instructions for copy-in consumers)
        type: string
        default: ''
      ci-workflow:
        description: >-
          File name of the CALLER's CI workflow to dispatch on the bump branch
          before the merge (e.g. ci.yml). Default '' finds it: the one file in
          .github/workflows that calls family-ci.yml and carries
          workflow_dispatch; none or several is an error that names them.
        type: string
        default: ''
      ci-wait-minutes:
        description: >-
          How long the merge waits for that CI run to finish on the bump
          branch's head commit before giving up (a red run either way).
        type: number
        default: 40

# Nothing by default: each job asks for exactly what its runs use (the
# family's workflow rule, 2026-11-13). The caller's grant is the ceiling.
permissions: {}

# Two runs (a schedule and a dispatch) racing on the same `auto/kit-pin-bump`
# branch would each open/update the PR and fight over the merge; queue them.
concurrency:
  group: jfs-kit-pin-bump-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Read-only: every step that runs code resolved seconds ago lives here.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Downgraded from the caller's grant. The bumper's git ls-remote, the
      # API pre-flight and a check-command that fetches a private data
      # branch of the same repo all need only read.
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    defaults:
      run:
        # An explicit `shell: bash` runs every step as `bash -eo pipefail`;
        # the implicit default is `bash -e` only, so a failing left-hand side
        # of a pipe inside a caller's check-command was swallowed — and that
        # command is the ONLY validation a bump gets before it merges.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The install steps below run npm lifecycle scripts from kit commits
          # that were resolved seconds ago and reviewed by nobody. Don't leave
          # even the read token in .git/config for them.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Same precedence trick as family-ci.yml: setup-node prefers a
          # non-empty `node-version` OVER `node-version-file`, so it goes in
          # empty whenever a file is named. With no file named this resolves
          # to exactly `inputs.node-version`, as before.
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Bump @jfs kit pins to their current HEADs
        env:
          # Read-only in this job — enough for the bumper's pin pre-flight.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run kit-pins:bump

      # kit-pins:bump touches package.json only when a pin actually moved,
      # so this single check gates every later stage.
      - name: Detect whether any pin moved
        id: diff
        run: |
          if git diff --quiet package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pins unchanged — nothing to vendor, bump, or check."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-vendor from the bumped pins
        if: steps.diff.outputs.changed == 'true' && inputs.vendor-sync-command != ''
        run: ${{ inputs.vendor-sync-command }}

      # The canonical family-conventions text lives in vendor-cli, so an
      # edit to it always arrives at a consumer as a vendor-cli pin bump —
      # this step is what carries the new block out. Before it existed the
      # sync was manual and nothing ran it: when the canonical text gained
      # a section, six consumers sat red on family CI's conventions check
      # until a session re-synced them by hand. A modified CLAUDE.md rides
      # the same PR below; it needs no version bump of its own (the bump
      # step is for re-vendored shipped assets, and conventions text is
      # not one — it just shares the PR the pin move already earns).
      - name: Sync the CLAUDE.md family-conventions block
        if: steps.diff.outputs.changed == 'true' && inputs.claude-md-sync-command != ''
        run: ${{ inputs.claude-md-sync-command }}

      # The other canonical text, the same way. Before this step only
      # CLAUDE.md rode the bump, so an edit to family/maintenance.md left every
      # consumer that opted into family CI's maintenance-check red until a
      # session re-synced it by hand — and a caller whose check-command runs
      # that check would have failed its own bump.
      - name: Sync the MAINTENANCE.md family-maintenance block
        if: steps.diff.outputs.changed == 'true' && inputs.maintenance-sync-command != ''
        run: ${{ inputs.maintenance-sync-command }}

      # The re-vendored copies are shipped assets, so the family's version
      # rule applies: patch-bump so the merged PR rolls the service-worker
      # cache instead of leaving returning visitors on the stale shell.
      - name: Bump the app version
        if: steps.diff.outputs.changed == 'true' && inputs.version-bump-command != ''
        run: ${{ inputs.version-bump-command }}

      # PRs opened with the default GITHUB_TOKEN never trigger pull_request
      # workflows, so the repo's CI can't validate this PR before merge. Run
      # the same checks here instead — the merge job below is only reached
      # if they pass. Nothing in THIS workflow runs CI after that: a merge
      # made with GITHUB_TOKEN fires no push workflows either, so the merged
      # commit gets no CI run on main (BearsMockDraft measured it: neither its
      # pin-bump merge nor its data-refresh merge produced one). A caller can
      # add that backstop itself — dispatch its own CI on main from a job
      # gated on this workflow's `merge-sha` output, as market-monitor's
      # `ci-on-main` does — but without one, this step is the only validation
      # the bump ever gets, which is why it is required rather than optional.
      - name: Run the repo's CI checks against the bumped tree
        if: steps.diff.outputs.changed == 'true' && inputs.check-command != ''
        env:
          # Same export, for the same reason, as family-ci.yml puts on its own
          # `run` step: the checkout above is persist-credentials: false, so a
          # check that has to reach GitHub itself — fetching a private orphan
          # data branch is the family's case — has no credential unless this
          # workflow hands it one, and `github.token` is not interpolatable in
          # a caller's `with:` block, so the caller cannot supply it either.
          #
          # This was missing here while family-ci had it, so the SAME
          # check-command passed in CI and failed in the bump. It cost
          # JFS-Sports four consecutive silent weekly bumps: `ws:data:fetch`
          # died on `fatal: could not read Username for 'https://github.com'`
          # 16 seconds in, before the PR step, so the repo's kit pins sat
          # behind every sibling's while its workflow page said only
          # "failure". Keep the two workflows' check steps in step.
          #
          # In this job the token is READ-ONLY (see the job's permissions):
          # a fetch still works, and the checks can no longer push anything.
          GITHUB_TOKEN: ${{ github.token }}
        run: ${{ inputs.check-command }}

      # Hand the result over as a patch. The write job applies it with
      # `git apply` — data, not code — so nothing that ran here ever meets
      # the write token. A pin bump has no business touching .github/ or
      # .claude/; refuse rather than discover that at the PR step. This copy
      # of the check only fails early: code that ran in THIS job could have
      # rewritten it, so the write job checks the patch again (see there).
      - name: Package the bumped tree as a patch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add -A
          if git diff --cached --name-only | grep -qE '^\.(github|claude)/'; then
            echo "::error::The bumped tree changes .github/ or .claude/ — a pin bump must never do that. Refusing to hand it to the write job."
            exit 1
          fi
          git diff --cached --binary > "$RUNNER_TEMP/kit-pin-bump.patch"
          echo "Patch: $(wc -c < "$RUNNER_TEMP/kit-pin-bump.patch") bytes, $(git diff --cached --name-only | wc -l) files"

      - uses: actions/upload-artifact@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          name: kit-pin-bump-${{ github.run_id }}
          path: ${{ runner.temp }}/kit-pin-bump.patch
          retention-days: 1
          if-no-files-found: error

  # Write-scoped: applies the patch, opens the PR, dispatches the repo's CI on
  # it, merges. Runs NO code from the repo or its dependencies — no install,
  # no scripts, no checks: the CI it dispatches runs in the repo's own CI
  # workflow, under that workflow's own (read-only) token.
  bump:
    needs: prepare
    # The family App's key is read from the `family-bot` environment, not
    # from repository secrets (2026-11-05). A repository secret is readable
    # by any workflow on any branch of the repo: one pushed branch carrying
    # a workflow that names FAMILY_BOT_PRIVATE_KEY would leak a key that
    # mints write tokens for every family repo. The environment's deployment
    # branch rule admits only the default branch, so its secrets reach only
    # runs on it: the monthly schedule and a dispatch from main.
    # An environment secret takes precedence over a repository secret of
    # the same name, and the caller still passes both by name, so no caller
    # changes. A repo whose environment does not exist yet gets an empty one
    # on its first run and keeps its repository secrets until they move.
    environment: family-bot
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # The CI wait is bounded by ci-wait-minutes (default 40); this is the
    # backstop above it.
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      # The commit the squash-merge put on the default branch, and the only
      # thing the release job below needs from this one. Empty whenever no
      # merge happened (auto-merge off, the merge was blocked).
      merge-sha: ${{ steps.land.outputs.merge-sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # create-pull-request pushes with the token it is handed explicitly;
          # nothing else here needs a credential in .git/config.
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: kit-pin-bump-${{ github.run_id }}
          path: ${{ runner.temp }}

      # The path refusal again, here, because this is the copy nothing
      # untrusted can reach: `prepare` ran the code the patch came from, so
      # its own check proves nothing about what it uploaded. Refused:
      # - .github/ — workflows (which neither token could push anyway), but
      #   also .github/actions/, which no token permission protects and
      #   which a workflow on main may run with secrets;
      # - .claude/ — the automated sessions' permission allowlist.
      # Nothing a bump legitimately writes lives under either (pins, lockfile,
      # vendored copies, CLAUDE.md, MAINTENANCE.md, version files).
      - name: Apply the bumped tree
        run: |
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/kit-pin-bump.patch"
          if refused=$(git diff --cached --name-only | grep -E '^\.(github|claude)/'); then
            echo "::error::The bump patch changes paths a pin bump must never touch; nothing is opened:"
            while IFS= read -r path; do echo "  $path"; done <<<"$refused"
            exit 1
          fi
          git status --short

      # Which commit of vendor-cli is this run executing? The same script as
      # family-ci.yml's (test/workflows.test.mjs holds the two copies
      # identical): the `github` context is the caller's, so the answer is
      # on the caller's own `uses:` line, in the checkout. Bash, grep and
      # sed over one file — nothing from the repo runs, and the key has not
      # arrived yet.
      - name: Resolve the commit this workflow was called at
        id: tooling
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLED: kit-pin-bump.yml
        run: |
          set -euo pipefail
          # WORKFLOW_REF is owner/repo/.github/workflows/<file>@<ref> — the
          # CALLER's workflow, and the one file GitHub read to start this run.
          file=${WORKFLOW_REF#*/.github/workflows/}
          file=${file%%@*}
          caller=".github/workflows/$file"
          if [ ! -f "$caller" ]; then
            echo "::error::Cannot find the calling workflow ($caller, from github.workflow_ref=$WORKFLOW_REF) in the checkout, so the commit $CALLED was called at is unknown."
            exit 1
          fi
          # Every `uses:` of this workflow in that file (owner/repo is
          # case-insensitive on GitHub, so is this; a commented-out line is
          # not a `uses:` line), with the ref after the `@` and nothing
          # else: quotes, a trailing comment and whitespace come off.
          mapfile -t refs < <(grep -iF -- "jsvolos63/vendor-cli/.github/workflows/$CALLED@" "$caller" \
            | grep -E '^[[:space:]]*(-[[:space:]]+)?uses:' \
            | sed -E "s#^.*/$CALLED@##; s#[\"']?[[:space:]]*(\\#.*)?\$##" | sort -u)
          if [ "${#refs[@]}" -ne 1 ] || [ -z "${refs[0]}" ]; then
            echo "::error::Expected exactly one 'uses: jsvolos63/vendor-cli/.github/workflows/$CALLED@<ref>' in $caller; found ${#refs[@]}${refs[*]:+: ${refs[*]}}."
            exit 1
          fi
          ref=${refs[0]}
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "$CALLED was called at commit $ref; the family tooling is checked out at that commit."
          else
            echo "::warning::$caller calls $CALLED at the mutable ref '$ref' (FAM-2), so the family tooling follows that ref. Pin it: uses: jsvolos63/vendor-cli/.github/workflows/$CALLED@<sha> # vX.Y.Z"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # The tooling checkout must never ride the bump PR: it is excluded from
      # this clone's index before it exists, so `git add -A` and a stash
      # (which create-pull-request may use) skip it like any ignored path.
      # Git only, before the key arrives.
      - name: Keep the tooling checkout out of the pull request
        run: echo '/.jfs-family/' >> "$(git rev-parse --git-dir)/info/exclude"

      - uses: actions/checkout@v7
        with:
          repository: jsvolos63/vendor-cli
          ref: ${{ steps.tooling.outputs.ref }}
          path: .jfs-family/vendor-cli
          persist-credentials: false

      # The proof, in every run log: the commit the tooling checkout is at,
      # held to the ref the caller named when that ref is a commit.
      - name: Check the family tooling is at that commit
        env:
          REF: ${{ steps.tooling.outputs.ref }}
        run: |
          set -euo pipefail
          head=$(git -C .jfs-family/vendor-cli rev-parse HEAD)
          version=$(sed -nE 's/^  "version": "([^"]+)",?$/\1/p' .jfs-family/vendor-cli/package.json | head -1)
          echo "Family tooling: jsvolos63/vendor-cli@$head (version ${version:-?}), called at '$REF'."
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]] && [ "$head" != "$REF" ]; then
            echo "::error::The family tooling checkout is at $head, not the $REF this workflow was called at."
            exit 1
          fi

      # Open the PR, run the repo's CI on it, and merge it on green: the
      # family's shared land-bot-pr action, so BearsMockDraft's refresh
      # crons and this bump run one copy of these steps — called from the
      # checkout above, so it is the action at THIS workflow's commit, not
      # main's. It runs nothing from the repo: create-pull-request (signed
      # commit), gh against the API, and the CI workflow it dispatches
      # under that workflow's own token. With the family App's two secrets
      # it opens and merges as the App; without them it uses the default
      # token, whose merge the current branch protection refuses (FAM-1 (b)
      # in this repo's MAINTENANCE.md). This job is the only place the key
      # may go: nothing from the repo has run on this runner before the
      # action does.
      - name: Open, test and merge the bump PR
        id: land
        uses: ./.jfs-family/vendor-cli/.github/actions/land-bot-pr
        with:
          app-id: ${{ secrets.FAMILY_BOT_APP_ID }}
          app-private-key: ${{ secrets.FAMILY_BOT_PRIVATE_KEY }}
          branch: auto/kit-pin-bump
          commit-message: "Bump @jfs kit pins to current HEADs; re-vendor"
          title: "Bump @jfs kit pins to current HEADs"
          body: |
            Automated pin bump: the pinned `@jfs/*` kits have new commits on
            their default branches. Pins updated by `npm run kit-pins:bump`
            (the @jfs/vendor-cli jfs-bump-kit-pins bin); vendored copies
            regenerated, the CLAUDE.md family-conventions and MAINTENANCE.md
            family-maintenance blocks re-synced from the bumped vendor-cli,
            and the app version bumped per this
            repo's caller inputs; the repo's CI checks ran green inside the
            bump workflow (in a read-only job) before this PR was opened.
            The bump then dispatches the repo's CI workflow on this branch
            and merges only once that run is green on the head commit — the
            run whose checks branch protection reads. (A PR opened with the
            default GITHUB_TOKEN triggers no pull_request CI; one opened by
            the family App does, and the merge waits for that run to
            finish as well, because branch protection reads its checks too.)

            ${{ inputs.pr-body-extra }}
          ci-workflow: ${{ inputs.ci-workflow }}
          ci-wait-minutes: ${{ inputs.ci-wait-minutes }}
          auto-merge: ${{ inputs.auto-merge }}
          soft-fail: ${{ inputs.soft-fail }}
          stuck-note: Left unmerged, this repo's kit pins silently drift from the family.

  # Tag the version this bump just merged.
  #
  # In a repo without the family App's secrets the merge above is made with
  # the default GITHUB_TOKEN, and a GITHUB_TOKEN
  # push fires no workflows — the same fact the check step exists for, one
  # layer up. So the merged commit gets no CI run on the default branch, no
  # `workflow_run` reaches the repo's Release workflow, and the version this
  # workflow bumped is never tagged. That is not hypothetical: fifteen versions
  # across five repos had landed untagged, every one of them a Monday pin bump.
  #
  # So call release.yml here rather than waiting for a trigger that cannot
  # come, naming the exact commit that landed. It is the SAME workflow the repo
  # releases through normally — a second spelling of `gh release create` in
  # this file would be a second set of rules about what may be tagged — and it
  # still refuses to tag a version whose tag exists, so a kit caller (no
  # version bump) simply no-ops.
  #
  # A merge made as the family App DOES fire push workflows, so there CI on
  # main runs and the ordinary CI-gated path reaches release.yml as well. This
  # job still runs: the two meet in release.yml's concurrency group, and
  # whichever comes second finds the tag and does nothing.
  #
  # Skipped when the caller names no title, when nothing merged, and when
  # auto-merge is off: there the human's own merge fires CI, and the ordinary
  # CI-gated path tags it.
  #
  # A nested reusable-workflow call cannot be a local path (a `./` here would
  # name the CALLER's repository) and takes no expression, so this is the one
  # call that cannot follow the checkout above: it is pinned by SHA to a
  # release of this repo, with the version beside it, and Dependabot's
  # github-actions entry rolls it like any other pin. A change to release.yml
  # reaches this job one release later — the pin lags on purpose.
  release:
    needs: bump
    if: inputs.release-title != '' && needs.bump.outputs.merge-sha != ''
    permissions:
      contents: write   # the tag and the release; a called workflow cannot elevate
    uses: jsvolos63/vendor-cli/.github/workflows/release.yml@46d45e887c88d639d533695bc101fb9fbf544b4e # v0.22.7
    with:
      title: ${{ inputs.release-title }}
      ref: ${{ needs.bump.outputs.merge-sha }}
