# The family's reusable release workflow: tag `v<version>` from package.json
# and open a GitHub release, once per new version, on main.
#
# Seven repos hand-copied this and all seven drifted. The four kits carried the
# bare version; Weather added the backfill dispatch; this repo added a
# concurrency group and persist-credentials:false; JFS-Sports added the one
# that matters most — a gate on CI success, after "a plain push trigger tagged
# and published a release for a red main." Six of the seven could still do
# that. This is the union, in one place.
#
# The CALLER owns the triggers and must grant `contents: write` (a called
# workflow cannot elevate its own token):
#
#   name: Release
#   on:
#     workflow_run:
#       workflows: [Test]        # must match the CI workflow's `name:`
#       types: [completed]
#     workflow_dispatch:
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: jsvolos63/vendor-cli/.github/workflows/release.yml@main
#       with:
#         title: '@jfs/fetch-kit'
#
# A THIRD path is not a trigger at all: a sibling automation that has just
# MERGED a version bump calls this workflow directly, with `ref:` set to the
# commit it merged. That covers the case no trigger here can see — a merge made
# with the default GITHUB_TOKEN fires no push workflows, so the repo's CI never
# runs on the merged commit, so no `workflow_run` ever arrives and the version
# is never tagged. kit-pin-bump.yml (this repo) does exactly that. Measured on
# 2026-09-22 across the family: fifteen versions had landed on main untagged
# that way, and every single one was a Monday `Bump @jfs kit pins` merge —
# Weather 6, Art-Gallery- 3, John's News 2, market-monitor 2, Surf-Tracker 2.
#
# Edits here land in every consumer's next release — treat them like kit API
# changes.

name: Release (reusable)

on:
  workflow_call:
    inputs:
      title:
        description: >-
          Release title prefix. The tag is appended, so '@jfs/fetch-kit'
          yields '@jfs/fetch-kit v0.2.1'.
        required: true
        type: string
      version-file:
        description: JSON file whose `version` field names the release.
        required: false
        default: package.json
        type: string
      ref:
        description: >-
          The exact commit to read the version from and to tag. Set by a
          sibling automation that has just merged a validated commit whose
          push could announce nothing (kit-pin-bump.yml); '' leaves the two
          ordinary paths — the commit the green CI run validated, or the ref
          a manual dispatch chose.
        required: false
        default: ''
        type: string

# Back-to-back merges to main are the normal case (auto-merged bump PRs), and
# two concurrent runs can both pass the existence check before racing into
# `gh release create` — one of them then red-fails. Queue instead. Never
# cancel in progress: a cancelled run is a version that silently never got
# tagged.
concurrency:
  group: jfs-release-${{ github.repository }}
  cancel-in-progress: false

# Cap the token here as well as in the caller: a called workflow inherits the
# caller's grant, and the other three reusable workflows all declare their own
# ceiling. `gh release create` needs exactly contents: write.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only tag a commit CI went green on. A manual dispatch skips the gate on
    # purpose — that is the backfill path for a version that shipped before
    # this workflow existed, or whose push fired no workflows (a bump PR
    # auto-merged with the default GITHUB_TOKEN does not).
    # Defence in depth. Callers should ALSO carry `branches: [main]` on their
    # workflow_run trigger, but workflow_run fires for a CI run on ANY branch,
    # so a caller that forgets it would otherwise tag a feature branch's commit
    # and publish a release from unmerged work. Refuse that here too.
    # A manual dispatch is exempt: the ref is chosen deliberately, and
    # backfilling a tag from a non-default ref is a legitimate use.
    # `head_branch` is a NAME, not proof the commit is on the default branch:
    # workflow_run also fires for a fork PR's CI run, and a fork whose head
    # branch is literally named `main` would satisfy that test alone — then
    # get a release tagged from its own package.json. So the run's head
    # repository must be this repository too.
    #
    # An explicit `ref` skips the CI gate for the dispatch's reason, and is the
    # automatic half of that backfill: the caller has named ONE commit, which
    # it merged only after running the repo's own checks against it — precisely
    # because the merge it made announced nothing for the gate to read. Nobody
    # else can reach this path: a called workflow runs against the CALLER's
    # repository with the caller's token, so the only ref a caller can hand us
    # is one of its own.
    if: >-
      inputs.ref != ''
      || github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == github.event.repository.default_branch
          && github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@v5
        with:
          # On workflow_run the default checkout is the branch head at trigger
          # time — pin to the commit the green CI run actually validated, so
          # the tag cannot land on a newer, unvalidated push. A caller-supplied
          # `ref` wins over both for the same reason: it names the one commit
          # that was merged, where "the head of main now" would race whatever
          # merged next.
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          # Only package.json is read after this; don't leave a contents:write
          # credential sitting in .git/config for the later steps.
          persist-credentials: false

      - name: Create the release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          TITLE: ${{ inputs.title }}
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          set -euo pipefail
          # The file path stays an env var all the way into node (never
          # spliced into a JS string), and the version is held to the same
          # character set the stamper's VERSION_RE allows before it is used
          # as a tag or handed to gh, where a leading '-' would read as a flag.
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync(process.env.VERSION_FILE, 'utf8')).version")
          case "$VERSION" in
            ''|-*|*[!A-Za-z0-9._-]*)
              echo "::error::refusing to tag suspicious version '$VERSION' from $VERSION_FILE"
              exit 1;;
          esac
          TAG="v$VERSION"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do"
            exit 0
          fi

          # The check above is advisory, not a lock: the concurrency group
          # serialises this repo's own runs, but a tag can still arrive from
          # elsewhere between the check and the create. Treat "it exists now"
          # as success — the goal is that the tag exists, not that this run is
          # the one that made it. Anything else is a real failure.
          if ! gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$TARGET_SHA" \
                --title "$TITLE $TAG" \
                --generate-notes; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG was created concurrently — nothing to do"
              exit 0
            fi
            echo "::error::Failed to create release $TAG"
            exit 1
          fi
