# Dependabot merge — the @jfs family's reusable auto-merge (workflow_call).
#
# Dependabot's PRs DO trigger pull_request CI (unlike a session's or a bot's
# GITHUB_TOKEN push), but that run holds a read-only token, so nothing in it
# can merge. Before this workflow the PRs simply sat: three of them were a
# week old across two repos when the family review found them, one carrying
# the fix for a HIGH prod-audit failure that had CI red on main.
#
# The caller triggers on its CI workflow completing and hands the event
# here; this job merges the PR when the run is green, the PR is Dependabot's
# own (same repo, dependabot[bot] author) and every bump it carries is minor
# or patch. A MAJOR bump is left open for a session or a human — that is a
# behaviour change to read, not a lockfile refresh.
#
# So is an npm GROUPED version update that bumps a direct PRODUCTION
# dependency, minor or patch (`hold-production`, default true — the family
# security audit's FAM-4). A merge to main deploys, and a production
# dependency runs in the functions that hold every API key, so auto-merging
# one on green CI made a hijacked patch release a direct path into those
# runtimes with no human anywhere — the suites fake the network, so CI says
# nothing about what a release DOES. Dependabot's cooldown gives a bad release
# a week to be yanked; this makes a session read it before it ships.
# Development dependencies still merge on green: they run in CI and on
# laptops, never in production.
#
# The test is Dependabot's own metadata — the `updated-dependencies:` block it
# writes into its commit message: a `dependency-type:` per dependency
# (`direct:production`, `direct:development`, `indirect`) and, for a grouped
# version update, a `dependency-group:` — not the group's NAME, which each
# repo's dependabot.yml spells however it likes. An UNGROUPED minor/patch PR
# is not held: the family groups every minor/patch version update, so an
# ungrouped one is a security update, and a fix for a published advisory
# should not wait on a session (John's News drew the same line first, in its
# own caller; FAM-4's fix has the same shape — exclude production from the
# auto-merged GROUP). That makes the grouping load-bearing: a repo whose
# dependabot.yml stopped grouping minor/patch would let production version
# updates through ungrouped. `indirect` (lockfile-only) bumps are not held
# either: the metadata cannot say which tree they sit under. An npm PR with no
# readable metadata is held, as a body the major parser cannot read is.
# GitHub Actions bumps are not npm and are not held. Pair this with a
# dependabot.yml that groups production apart from development, or one
# production bump holds the whole group's dev bumps with it.
#
#   name: Dependabot merge
#   on:
#     workflow_run:
#       workflows: [CI]        # MUST match the CI workflow's `name:` exactly
#       types: [completed]
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     merge:
#       uses: jsvolos63/vendor-cli/.github/workflows/dependabot-merge.yml@main
#
# The merge is made with GITHUB_TOKEN, so — exactly like the kit-pin bump —
# it fires no push workflows on main: the PR's own CI run is the only
# validation the change gets, which is why this gates on it.
name: Dependabot merge (reusable)

on:
  workflow_call:
    inputs:
      allow-major:
        description: Merge major bumps too (default false — leave them open)
        type: boolean
        default: false
      hold-production:
        description: >-
          Leave an npm grouped version update open, minor or patch, when it
          bumps a direct production dependency (Dependabot's
          `dependency-type: direct:production` beside a `dependency-group:`),
          so a session reads the release before it deploys (FAM-4). An
          ungrouped one — a security update — still merges. Default true;
          false restores merging every minor/patch bump on green.
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.actor.login == 'dependabot[bot]'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Merge the green Dependabot PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ALLOW_MAJOR: ${{ inputs.allow-major }}
          HOLD_PRODUCTION: ${{ inputs.hold-production }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --state open \
                --json number,author,headRefOid,body,title --jq '.[0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open PR for $HEAD_BRANCH — nothing to merge"; exit 0
          fi
          author=$(jq -r '.author.login' <<<"$pr")
          number=$(jq -r '.number' <<<"$pr")
          head=$(jq -r '.headRefOid' <<<"$pr")
          if [ "$author" != "dependabot" ] && [ "$author" != "app/dependabot" ] && [ "$author" != "dependabot[bot]" ]; then
            echo "PR #$number is by $author, not Dependabot — leaving it"; exit 0
          fi
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "PR #$number moved past the green run ($HEAD_SHA -> $head) — waiting for CI on the new head"; exit 0
          fi
          # Dependabot writes "Bumps X from A to B" (single) or "Updates `X`
          # from A to B" (grouped) into the body; a major bump is one whose
          # first number changes. Anything unreadable counts as major.
          text=$(jq -r '.title + "\n" + .body' <<<"$pr")
          major=0; seen=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            seen=1
            from=${line% to *}; from=${from##* from }; to=${line##* to }
            fm=${from%%.*}; tm=${to%%.*}
            case "$fm$tm" in *[!0-9]*) major=1;; esac
            [ "$fm" = "$tm" ] || major=1
          done < <(grep -oE '(Bumps|Updates|bumps|updates) [^ ]+ from [0-9][^ ]* to [0-9][^ ]*' <<<"$text" | sed 's/`//g' || true)
          if [ "$seen" = 0 ]; then major=1; fi
          if [ "$major" = 1 ] && [ "$ALLOW_MAJOR" != "true" ]; then
            echo "PR #$number carries a major bump (or one this parser cannot read) — left open for a review"; exit 0
          fi
          # FAM-4: a grouped version update that bumps a direct production
          # dependency waits for a session (see the header). npm only —
          # Dependabot names the ecosystem in the branch,
          # dependabot/npm_and_yarn/... — and read from its commit metadata,
          # every commit on the PR, since a rebase can leave more than one.
          if [ "$HOLD_PRODUCTION" = "true" ] && [[ "$HEAD_BRANCH" == dependabot/npm_and_yarn/* ]]; then
            meta=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json commits \
                     --jq '[.commits[].messageBody] | join("\n")')
            types=$(grep -oE 'dependency-type: *[a-z:]+' <<<"$meta" | sed 's/dependency-type: *//' | sort -u || true)
            if [ -z "$types" ]; then
              echo "PR #$number carries no readable Dependabot metadata, so it may bump a production dependency — left open for a review"; exit 0
            fi
            if grep -qx 'direct:production' <<<"$types" && ! grep -qE 'dependency-group: *[^ ]' <<<"$meta"; then
              echo "PR #$number bumps a production dependency outside any group — a security update, since every minor/patch version update is grouped — so it merges on green"
            elif grep -qx 'direct:production' <<<"$types"; then
              # Scoped names come double-quoted ("@netlify/blobs").
              names=$(awk '/dependency-name:/ { n = $0; sub(/.*dependency-name:[[:space:]]*/, "", n); gsub(/"/, "", n) }
                           /dependency-type:[[:space:]]*direct:production/ { print n }' <<<"$meta" \
                        | sort -u | paste -sd, - || true)
              echo "PR #$number bumps a production dependency (${names:-unnamed}) — left open for a session to read the release before it deploys (FAM-4)"
              {
                echo "### Dependabot PR #$number held: production dependency"
                echo
                echo "Bumps \`${names:-a direct production dependency}\`. Read each package's release notes and"
                echo "what changed between the versions, then squash-merge it by hand once CI is green."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          # The head check above is a snapshot; bind the merge itself to the
          # SHA the green run validated so a push landing in between is
          # refused by GitHub rather than merged unvalidated.
          gh pr merge --squash --delete-branch --match-head-commit "$HEAD_SHA" \
            --repo "$GITHUB_REPOSITORY" "$number"
          echo "Merged Dependabot PR #$number"
