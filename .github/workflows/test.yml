# CI for @jfs/vendor-cli — runs through the family's reusable workflow
# (family-ci.yml, which lives in this repo). Referenced locally (uses: ./…)
# so a PR that edits family-ci.yml is validated by its own edited copy.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-ci:
    uses: ./.github/workflows/family-ci.yml
    with:
      # Dogfoods the input this repo ships. It resolves to the same 22 the
      # default would have given, so CI's Node is unchanged — but the new code
      # path is now exercised by this repo's own run, which (via `uses: ./…`)
      # is the edited copy. A PR that breaks the file path, the precedence, or
      # the expression fails HERE rather than in thirteen consumers' next run.
      node-version-file: .nvmrc
      # Dogfoods the other input this repo ships: both maintenance gates run
      # here against this repo's own MAINTENANCE.md and its own tooling, so a
      # PR that breaks either fails HERE rather than in the consumers.
      maintenance-check: true
      # esbuild (the narrowing bundler, exact-pinned) must be installed for
      # the tree-shaking tests; the suite imports index.mjs directly.
      install-command: npm install
      run: |
        npm run lint
        npm test
      # family/ ships in the package (the canonical CLAUDE.md block), so its
      # edits need a version bump like any shipped-module change.
      version-guard-paths: index.mjs bin family tools
