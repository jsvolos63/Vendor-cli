# CI for @jfs/vendor-cli — runs through the family's reusable workflow
# (family-ci.yml, which lives in this repo). Referenced locally (uses: ./…)
# so a PR that edits family-ci.yml is validated by its own edited copy.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

# Nothing by default: the job asks for exactly what it uses (the family's
# workflow rule, 2026-11-13; test/workflows.test.mjs).
permissions: {}

jobs:
  family-ci:
    permissions:
      contents: read   # the checkouts; nothing writes
    uses: ./.github/workflows/family-ci.yml
    with:
      # Dogfoods the input this repo ships. It resolves to the same 22 the
      # default would have given, so CI's Node is unchanged — but the new code
      # path is now exercised by this repo's own run, which (via `uses: ./…`)
      # is the edited copy. A PR that breaks the file path, the precedence, or
      # the expression fails HERE rather than in thirteen consumers' next run.
      node-version-file: .nvmrc
      # Dogfoods the other input this repo ships: both maintenance gates run
      # here against this repo's own MAINTENANCE.md and its own tooling, so a
      # PR that breaks either fails HERE rather than in the consumers.
      maintenance-check: true
      # esbuild (the narrowing bundler, exact-pinned) must be installed for
      # the tree-shaking tests; the suite imports index.mjs directly. A clean
      # install from the committed lockfile, with no install scripts — the
      # family default (FAM-11: this repo kept no lockfile until 2026-11-13,
      # so its dev tree resolved fresh, scripts and all, on every run).
      install-command: npm ci --ignore-scripts
      # The whole installed tree is dev here, so prod-audit would cover
      # nothing: audit all of it, and verify every tarball's signature.
      audit: true
      audit-signatures: true
      run: |
        npm run lint
        npm test
      # Every entry of package.json's `files` — everything a consumer's pin
      # delivers (the canonical texts, the monitor and doc-check tools, the
      # module-graph linker four consumer suites import) — so a change to any
      # of it needs a version bump like any shipped-module change.
      # test/workflows.test.mjs holds this list to `files`.
      version-guard-paths: index.mjs bin family tools module-graph
