# CI for @jfs/vendor-cli — runs through the family's reusable workflow
# (family-ci.yml, which lives in this repo). Referenced locally (uses: ./…)
# so a PR that edits family-ci.yml is validated by its own edited copy.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  family-ci:
    uses: ./.github/workflows/family-ci.yml
    with:
      # No dependencies — the suite imports index.mjs directly.
      install-command: ''
      run: npm test
      # family/ ships in the package (the canonical CLAUDE.md block), so its
      # edits need a version bump like any shipped-module change.
      version-guard-paths: index.mjs bin family
