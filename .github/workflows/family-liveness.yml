# Family automation liveness — the one job that watches the other jobs.
#
# The family's four reusable workflows keep fourteen repos maintained with the
# owner away. Nothing watched THEM. A scheduled run that fails produces no
# issue, no comment and no message anyone reads, and on 2026-09-22 the weekly
# kit-pin bump was found to have failed on every scheduled run for four to five
# weeks in four repos, from two unrelated causes, in silence — three of them
# having pushed a correct bump to a branch no pull request was ever opened for.
#
# This runs `tools/family-liveness.mjs` across every repo and opens ONE issue
# HERE when something needs a session. One issue in the hub, not a notification
# in thirteen repos: a notification per repo would need an `issues: write` grant
# in each of them, and the failure of the notifier would itself be silent.
#
# Runs DAILY at 08:10 UTC (since 2026-11-05; it was Mondays and the 2nd).
# Weekly left a mid-week break unreported for days: BearsMockDraft's data
# refreshes stopped landing on Tuesday 2026-11-03 and the next run would have
# said so the following Monday, and a green PR a session forgot to merge
# (market-monitor #479) sat three days. 08:10 is still ~90 minutes after the
# monthly 06:41 kit-pin bump on the 2nd, so that morning's run sees the bump.
# It costs Actions minutes only, and ~200 API calls against a PAT's 5,000/hour.
#
# Daily does NOT mean a daily comment. The report carries a fingerprint of its
# findings (stable keys, not the wording, which has ages in it), and the issue
# step comments only when it differs from the last report's, or when that
# report is a week old. The run is red every day something needs attention;
# the issue says something new only when there is something new.
#
# NO `npm ci`. The script is dependency-free for exactly this reason: a broken
# lockfile or a failed install must never be able to blind the monitor. Same
# principle as Surf-Tracker's health check, which was written after a 54-day
# silent content outage.
name: Family liveness

on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: family-liveness
  cancel-in-progress: false

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # The one file that names this repo's Node, as test.yml's family-ci
          # call reads it — not a second literal beside it.
          node-version-file: .nvmrc

      - name: Check every repo's automation
        id: check
        env:
          # A repo-scoped GITHUB_TOKEN cannot see its siblings, so this is the
          # one job in the family that needs a PAT (read: contents, actions,
          # pull-requests on the owner). Without it the script exits 2 and the
          # step below fails the run — an unconfigured monitor must never read
          # as a healthy family.
          FAMILY_READ_TOKEN: ${{ secrets.FAMILY_READ_TOKEN }}
        run: |
          set +e
          node tools/family-liveness.mjs --markdown > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md

      - name: Open or update the liveness issue
        if: steps.check.outputs.status == '1' || steps.check.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
          # A week, less a margin so the same weekday's run still posts: a
          # report left standing is re-posted every seventh day.
          REMIND_SECONDS: '561600'
        run: |
          set -euo pipefail
          title="Family automation liveness: attention needed"
          # One rolling issue, not one per week: a new issue every Monday would
          # train everyone to close them unread, which is the failure this whole
          # job exists to prevent.
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          {
            if [ "$STATUS" = "2" ]; then
              echo "> **The check could not complete.** This is not a clean bill of health —"
              echo "> see \`FAMILY_READ_TOKEN\` under the job's env."
              echo
            fi
            cat report.md
          } > body.md
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file body.md
            exit 0
          fi
          # The fingerprint of this report, and of the newest report this job
          # posted: its last comment carrying one, else the issue body.
          marker='<!-- liveness-fingerprint: ([0-9a-f]{16}) -->'
          fp=$(sed -nE "s/^${marker}\$/\\1/p" report.md | tail -1)
          pick='[(.body | capture("<!-- liveness-fingerprint: (?<f>[0-9a-f]{16}) -->").f), .created_at] | @tsv'
          last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$existing/comments?per_page=100" --paginate \
                   --jq ".[] | select(.user.login == \"github-actions[bot]\") | select((.body // \"\") | test(\"<!-- liveness-fingerprint: [0-9a-f]{16} -->\")) | $pick" | tail -1)
          if [ -z "$last" ]; then
            last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$existing" \
                     --jq "select((.body // \"\") | test(\"<!-- liveness-fingerprint: [0-9a-f]{16} -->\")) | $pick")
          fi
          last_fp=$(cut -f1 <<<"$last")
          last_at=$(cut -f2 <<<"$last")
          age=$(( $(date +%s) - $(date -d "${last_at:-1970-01-01T00:00:00Z}" +%s) ))
          if [ -n "$fp" ] && [ "$fp" = "$last_fp" ] && [ "$age" -lt "$REMIND_SECONDS" ]; then
            echo "Same findings as the report of $last_at (fingerprint $fp): no new comment until they change or a week passes. The run is still red."
          else
            gh issue comment "$existing" --body-file body.md
          fi
      # A healthy run closes the rolling issue, so an OPEN issue always means
      # "a session is needed now". Nothing closed it before: once the family
      # was fixed, the last red report stood open as if it were current until
      # someone closed it by hand. The healthy report is posted as the closing
      # comment, so the thread records when and how it went green.
      - name: Close the liveness issue when the family is healthy
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Family automation liveness: attention needed"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
            gh issue close "$existing" --reason completed
          fi

      # The run itself must be red, not merely commented on: a green run with an
      # issue attached is the same invisible signal all over again.
      - name: Fail the run when something needs attention
        if: steps.check.outputs.status != '0'
        run: |
          echo "family-liveness exited ${{ steps.check.outputs.status }} (1 = needs attention, 2 = could not check)."
          exit 1
