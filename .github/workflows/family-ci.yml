# Family CI — the @jfs family's reusable check workflow (workflow_call).
#
# Every repo in the family used to hand-copy the same CI skeleton (checkout →
# setup-node → kit-pin pre-flight → install → checks), and the copies drifted:
# different action versions, different node versions, and a raw-URL kit-pin
# check pinned to whatever vendor-cli SHA was current when each repo was set
# up. Consumers now call this workflow instead:
#
#   permissions: {}            # nothing by default; the job asks for its own
#   jobs:
#     family-ci:
#       permissions:
#         contents: read
#       # A release's commit, never `@main` (FAM-2); Dependabot's
#       # github-actions entry rolls the pin to the next tag.
#       uses: jsvolos63/vendor-cli/.github/workflows/family-ci.yml@<sha> # vX.Y.Z
#       with:
#         verify-kit-pins: true
#         audit: true
#         audit-signatures: true
#         run: |
#           npm run vendor:check
#           npm test
#
# A repo that already pins Node for its deploy can pass `node-version-file:
# .nvmrc` instead of `node-version:`, so one file governs CI and the deploy
# both. It is opt-in — see that input's description.
#
# One place to bump an action, tighten a gate, or add a family-wide check.
# Treat edits here like kit API changes: they land in every repo's next CI
# run at once. This repo's own test.yml references the workflow locally
# (uses: ./...), so a PR that edits it is validated by its own edited copy.
#
# The workflow checks out THIS repo alongside the caller so the kit-pin
# pre-flight and the CLAUDE.md family-conventions check run from a bare
# checkout — consumers don't need @jfs/vendor-cli installed for either gate
# (every repo pins it, kits included, but these gates don't require the
# install to have run). When the caller IS vendor-cli,
# the local checkout is used instead so a PR here validates against its own
# canonical text, not main's.
#
# THAT CHECKOUT IS AT THE COMMIT THIS WORKFLOW WAS CALLED AT (2026-11-13,
# FAM-2). It used to take no `ref`, which fetches vendor-cli's default branch
# — so a caller that pinned `uses: …/family-ci.yml@<sha>` would have run an
# old workflow against whatever tooling main held that day, a mismatch that
# breaks without warning when the two move together (JFS-Sports measured it
# on run 43338472557, which is why the callers could not be pinned first).
# Nothing in the `github` context names the commit a called workflow was
# fetched at — in a reusable workflow that context is the CALLER's, and the
# OIDC claim that does name it (`job_workflow_sha`) would cost every caller
# an `id-token: write` grant — so the ref is read off the caller's own
# `uses:` line, in its checkout: the same file GitHub read to start this
# run. A caller still at `@main` gets main, as before, and a warning.
name: Family CI

on:
  workflow_call:
    inputs:
      node-version:
        description: >-
          Node.js version to set up. 22 (Node 20 reached end of life in
          April 2026, and kit-pin-bump.yml has defaulted to 22 all along —
          the two workflows used to disagree). Ignored when
          node-version-file is set.
        type: string
        default: '22'
      node-version-file:
        description: >-
          Path to a .nvmrc / .node-version in the CALLING repo. When set, that
          file decides the Node version and `node-version` is ignored, so a
          repo that already pins Node for its deploy (Netlify reads .nvmrc,
          and the functions runtime follows the build) stops naming the
          version a second time here — where the two could drift onto
          different majors and a green CI run would say nothing about the
          runtime actually serving the app. That had happened: John's News
          tested on 22 while its deploy ran Netlify's default 24.

          OPT-IN, and deliberately not "use .nvmrc if one exists": a repo with
          a stale version file would otherwise have its CI silently retargeted
          by an edit here, and edits here land in every repo's next run at
          once. Default '' keeps `node-version` authoritative, so this input
          is a no-op for every caller that does not set it.

          The file must EXIST: setup-node throws rather than falling back, so
          a repo that opts in and later renames or deletes the file gets a
          failed job, not a silently different Node. That is the right way
          round, and worth knowing before you opt in.
        type: string
        default: ''
      python-version:
        description: Python version to set up ('' skips Python)
        type: string
        default: ''
      install-command:
        description: >-
          Dependency install command ('' skips the step). The default is a
          clean, reproducible install that runs NO package's install scripts
          (`--ignore-scripts`): a hijacked transitive that adds one runs
          nothing in CI, where a token is in the environment. It is a flag,
          not an .npmrc `ignore-scripts=true`, so a repo's own `npm run`
          pre/post hooks still run. A repo with no lockfile, or one whose
          dependency genuinely needs its install script (a native build),
          passes its own command — and says why beside it.
        type: string
        default: npm ci --ignore-scripts
      verify-kit-pins:
        description: Pre-flight that every pinned @jfs kit SHA resolves, before install
        type: boolean
        default: false
      prod-audit:
        description: >-
          Run `npm audit --omit=dev --audit-level=high` after install, so a
          high/critical advisory in a SHIPPED dependency fails the build.
          Dev-only advisories never gate — the kits and test toolchains are
          devDependencies everywhere, so they can't redden a PR. Cheap even
          for a repo with zero prod dependencies today: the gate arms itself
          the day one is added.
        type: boolean
        default: false
      audit:
        description: >-
          Run `npm audit --audit-level=high` over the WHOLE installed tree
          after install. `prod-audit` alone covers nothing in a repo whose
          every dependency is a devDependency — which is most of the family —
          and the dev tree is what runs in CI with a token and what builds
          the bundle every reader runs (JFS-Sports' JFS-11: four moderate
          advisories, one in eslint's own tree, that nothing reported). Opt-in,
          like maintenance-check: a repo turns it on once its tree is clean,
          and an edit here never reddens a caller that did not ask.
        type: boolean
        default: false
      audit-signatures:
        description: >-
          Run `npm audit signatures` after install: every installed registry
          tarball must verify against the registry's signatures and, where
          published with provenance, its attestations. Retried ONCE after 20
          seconds, and only once: the installed bytes do not change between
          the two tries, so a real tamper fails both, while a one-off
          verification hiccup on a runner (JFS-Sports #766: one "invalid
          attestation" for a package that verified everywhere else) does not
          block a merge. Needs a lockfile. Opt-in, like `audit`.
        type: boolean
        default: false
      claude-md-check:
        description: Check CLAUDE.md carries the current family-conventions block
        type: boolean
        default: true
      maintenance-check:
        description: >-
          Check MAINTENANCE.md carries the current family-maintenance block.

          OPT-IN, default false, for the same reason node-version-file is: this
          gate is checked against the vendor-cli commit the caller's `uses:`
          names (main, for a caller still at `@main`), so when the canonical
          text changes every consumer that opted in goes red — at once if
          unpinned, when its pin rolls if pinned — until it re-syncs. A repo
          turns it on in the same PR that adds its MAINTENANCE.md, and a new
          repo joining the family is never instantly red for a file it has
          not written yet.

          jfs-maintenance-sync refuses to CREATE MAINTENANCE.md — the file is
          half canonical and half repo-specific, and one holding only the family
          block would pass this gate while documenting nothing — so turning this
          on without writing the repo-specific half fails with that message
          rather than stamping a hollow file as compliant.
        type: boolean
        default: false
      run:
        description: Newline-separated check commands, run in order (fail-fast)
        type: string
        required: true
      version-guard-paths:
        description: >-
          Space-separated paths; on pull requests and manual dispatches,
          require a package.json version bump when any of them changed
          against the base ('' skips the job). The kit convention: consumers
          pin by commit SHA and releases tag by version, so a shipped-module
          change without a bump ships two different SHAs under one version
          label.
        type: string
        default: ''

# Nothing by default: each job asks for exactly what its runs use, so a job
# added later starts with no token at all (the family's workflow rule,
# 2026-11-13; JFS-Sports' JFS-13). A caller's grant is the ceiling either way.
permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read   # the two checkouts and a caller's data-branch fetch; nothing writes
    defaults:
      run:
        # `bash -eo pipefail` for every step, including the caller's `run`
        # block. The implicit shell is `bash -e` without pipefail, so a check
        # written as `npm test | tee log` reported green when npm test failed.
        shell: bash
    env:
      # vendor-cli's own CI validates against the PR's canonical text, not
      # main's — everyone else runs the family tooling from a main checkout.
      JFS_VENDOR_CLI_DIR: ${{ github.repository == 'jsvolos63/vendor-cli' && '.' || '.jfs-family/vendor-cli' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # TEMPORARY (scratch-branch measurement only, removed before merge):
      # which contexts, if any, name the CALLED workflow's commit on the
      # runner? Prints the candidates the owner asked to try — job.workflow_sha,
      # github.workflow_ref/sha — plus the `job` and `github` context keys and
      # whether the run API's referenced_workflows is readable with this job's
      # contents:read token. Keys and refs only; the token is masked anyway.
      - name: TEMP measure which contexts name the called commit
        env:
          JOB_JSON: ${{ toJSON(job) }}
          GITHUB_JSON: ${{ toJSON(github) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "github.workflow_ref=$(jq -r '.workflow_ref // "ABSENT"' <<<"$GITHUB_JSON")"
          echo "github.workflow_sha=$(jq -r '.workflow_sha // "ABSENT"' <<<"$GITHUB_JSON")"
          echo "github.job_workflow_sha=$(jq -r '.job_workflow_sha // "ABSENT"' <<<"$GITHUB_JSON")"
          echo "github.sha=$(jq -r '.sha // "ABSENT"' <<<"$GITHUB_JSON")"
          echo "job.workflow_sha=$(jq -r '.workflow_sha // "ABSENT"' <<<"$JOB_JSON")"
          echo "job context keys: $(jq -r 'keys|join(",")' <<<"$JOB_JSON")"
          echo "github context keys: $(jq -r 'keys|join(",")' <<<"$GITHUB_JSON")"
          env | grep -iE 'WORKFLOW|JOB_' | sort
          echo "--- referenced_workflows via the run API, this job's token:"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.referenced_workflows' || echo "run API refused with this token (exit $?)"

      # Which commit of vendor-cli is this run executing? See the header: the
      # `github` context is the caller's, so the answer is on the caller's
      # own `uses:` line. The script is bash, grep and sed over one file in
      # the checkout; the SAME script sits in kit-pin-bump.yml's write job,
      # and test/workflows.test.mjs holds the two copies identical and runs
      # them against pinned, unpinned, quoted, doubled and missing callers.
      - name: Resolve the commit this workflow was called at
        id: tooling
        if: (inputs.verify-kit-pins || inputs.claude-md-check || inputs.maintenance-check) && github.repository != 'jsvolos63/vendor-cli'
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLED: family-ci.yml
        run: |
          set -euo pipefail
          # WORKFLOW_REF is owner/repo/.github/workflows/<file>@<ref> — the
          # CALLER's workflow, and the one file GitHub read to start this run.
          file=${WORKFLOW_REF#*/.github/workflows/}
          file=${file%%@*}
          caller=".github/workflows/$file"
          if [ ! -f "$caller" ]; then
            echo "::error::Cannot find the calling workflow ($caller, from github.workflow_ref=$WORKFLOW_REF) in the checkout, so the commit $CALLED was called at is unknown."
            exit 1
          fi
          # Every `uses:` of this workflow in that file (owner/repo is
          # case-insensitive on GitHub, so is this; a commented-out line is
          # not a `uses:` line), with the ref after the `@` and nothing
          # else: quotes, a trailing comment and whitespace come off.
          mapfile -t refs < <(grep -iF -- "jsvolos63/vendor-cli/.github/workflows/$CALLED@" "$caller" \
            | grep -E '^[[:space:]]*(-[[:space:]]+)?uses:' \
            | sed -E "s#^.*/$CALLED@##; s#[\"']?[[:space:]]*(\\#.*)?\$##" | sort -u)
          if [ "${#refs[@]}" -ne 1 ] || [ -z "${refs[0]}" ]; then
            echo "::error::Expected exactly one 'uses: jsvolos63/vendor-cli/.github/workflows/$CALLED@<ref>' in $caller; found ${#refs[@]}${refs[*]:+: ${refs[*]}}."
            exit 1
          fi
          ref=${refs[0]}
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "$CALLED was called at commit $ref; the family tooling is checked out at that commit."
          else
            echo "::warning::$caller calls $CALLED at the mutable ref '$ref' (FAM-2), so the family tooling follows that ref. Pin it: uses: jsvolos63/vendor-cli/.github/workflows/$CALLED@<sha> # vX.Y.Z"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.tooling.outcome == 'success'
        with:
          repository: jsvolos63/vendor-cli
          ref: ${{ steps.tooling.outputs.ref }}
          path: .jfs-family/vendor-cli
          persist-credentials: false

      # The proof, in every run log: the commit the tooling checkout is at,
      # held to the ref the caller named when that ref is a commit.
      - name: Check the family tooling is at that commit
        if: steps.tooling.outcome == 'success'
        env:
          REF: ${{ steps.tooling.outputs.ref }}
        run: |
          set -euo pipefail
          head=$(git -C .jfs-family/vendor-cli rev-parse HEAD)
          version=$(sed -nE 's/^  "version": "([^"]+)",?$/\1/p' .jfs-family/vendor-cli/package.json | head -1)
          echo "Family tooling: jsvolos63/vendor-cli@$head (version ${version:-?}), called at '$REF'."
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]] && [ "$head" != "$REF" ]; then
            echo "::error::The family tooling checkout is at $head, not the $REF this workflow was called at."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          # setup-node prefers a non-empty `node-version` OVER `node-version-file`,
          # so when the caller names a file, `node-version` must go in empty or
          # the file would be read and then silently ignored.
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}

      - uses: actions/setup-python@v7
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}

      # Before install so a typo'd/hand-edited SHA fails with a clear message
      # instead of an opaque install-time git-128 / 404.
      - name: Verify @jfs kit pins exist
        if: inputs.verify-kit-pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The same gate consumers get as the `jfs-check-kit-pins` bin — one
        # spelling, not an inline re-implementation of it.
        run: node "$JFS_VENDOR_CLI_DIR/bin/check-kit-pins.mjs"

      - name: Install dependencies
        if: inputs.install-command != ''
        run: ${{ inputs.install-command }}

      # After install so audit sees the resolved tree (repos that gitignore
      # their lockfile get one from the install itself).
      - name: Audit shipped dependencies
        if: inputs.prod-audit
        run: npm audit --omit=dev --audit-level=high

      - name: Audit the whole installed tree
        if: inputs.audit
        run: npm audit --audit-level=high

      # One retry, then the second run's failure is the step's failure (the
      # `||` group ends on it). test/workflows.test.mjs pins the shape.
      - name: Verify registry signatures and attestations
        if: inputs.audit-signatures
        run: npm audit signatures || { echo '::warning::npm audit signatures failed; retrying once in 20 s'; sleep 20; npm audit signatures; }

      - name: Check CLAUDE.md family conventions are in sync
        if: inputs.claude-md-check
        run: node "$JFS_VENDOR_CLI_DIR/bin/claude-md-sync.mjs" --check

      - name: Check MAINTENANCE.md family maintenance protocol is in sync
        if: inputs.maintenance-check
        run: node "$JFS_VENDOR_CLI_DIR/bin/maintenance-sync.mjs" --check

      # The other half of the same gate. The sync check above proves the
      # CANONICAL block is current; this proves the REPO-SPECIFIC half is still
      # true of the repo — that every `npm run` it names is a real script, every
      # workflow and path it names exists, and every cron it quotes is the cron
      # that actually fires. A maintenance doc is trusted, so a stale claim in
      # one is worse than a gap: a session follows it instead of looking.
      - name: Check MAINTENANCE.md still describes this repo
        if: inputs.maintenance-check
        run: node "$JFS_VENDOR_CLI_DIR/tools/maintenance-doc-check.mjs"

      # vendor:check must be vendor:sync with `--check` appended per stage —
      # the two are hand-duplicated command chains in every consumer's
      # package.json, and nothing else enforces the duplication. A drifted
      # pair silently turns the CI drift gate into a no-op: check validates a
      # different generation than sync performs. Skips repos without the
      # scripts (the kits, Zepbound-).
      - name: Check vendor:sync / vendor:check agree
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("package.json")) { console.log("vendor-script-parity: no package.json - skipped"); process.exit(0); }
            const s = JSON.parse(fs.readFileSync("package.json", "utf8")).scripts || {};
            const sync = s["vendor:sync"], check = s["vendor:check"];
            if (!sync || !check) { console.log("vendor-script-parity: scripts absent - skipped"); process.exit(0); }
            const norm = check.split(" --check").join("");
            if (norm !== sync) {
              console.error("vendor-script-parity: vendor:check is NOT vendor:sync with --check appended per stage.");
              console.error("sync              : " + sync);
              console.error("check minus flags : " + norm);
              process.exit(1);
            }
            console.log("vendor-script-parity: vendor:check matches vendor:sync + --check.");
          '

      # The extra checkout must not leak into the caller's own checks (globbed
      # lints and syntax sweeps would pick it up).
      - name: Remove family tooling checkout
        if: github.repository != 'jsvolos63/vendor-cli'
        run: rm -rf .jfs-family

      # The workflow token is exported so a caller's checks can make
      # authenticated git/API calls (e.g. JFS-Sports fetching its ws-data
      # branch) — the checkout above deliberately strips remote credentials,
      # and `github.token` is not interpolatable in a caller's `with:` block,
      # so this is the one place it can reach the run commands. Its scope is
      # capped at `contents: read` by this workflow's own `permissions:`
      # block, whatever the caller grants.
      - name: Run checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ${{ inputs.run }}

  # The kit-style version-bump guard, formerly copy-pasted into eight repos.
  #
  # It runs on workflow_dispatch as well as pull_request. The family's
  # convention for session PRs is "dispatch CI on the branch and merge once
  # that run is green on the head commit" — and while this job ran on
  # pull_request alone, that dispatched run never carried it, so a shipped-path
  # change with no bump could be merged on an entirely green dispatch.
  #
  # A dispatch has no base ref, so it compares against the default branch.
  # The diff is three-dot (from the merge-base), so a branch that merely sits
  # behind main is never blamed for main's own changes, and a dispatch ON the
  # default branch diffs to nothing and passes.
  version-bump:
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && inputs.version-guard-paths != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # the full-history checkout it diffs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail if guarded paths changed without a package.json version bump
        env:
          GUARD_PATHS: ${{ inputs.version-guard-paths }}
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          BASE="origin/${BASE_BRANCH}"
          # Fail loudly on a base that is not there, rather than letting the
          # diff below error into the "changed" branch and fail obscurely.
          if [ -z "$BASE_BRANCH" ] || ! git rev-parse --verify --quiet "$BASE" >/dev/null; then
            echo "::error::version-bump: cannot resolve the base '${BASE}' to compare against"
            exit 1
          fi
          # GUARD_PATHS is a space-separated list, so the unquoted expansion is
          # deliberate — but `set -f` keeps it a word split only, not a glob
          # against the workspace.
          set -f
          # shellcheck disable=SC2086 # GUARD_PATHS is that word list, split on purpose
          if git diff --quiet "$BASE...HEAD" -- $GUARD_PATHS; then
            echo "guarded paths unchanged - no bump required"
            exit 0
          fi
          git show "$BASE:package.json" > /tmp/base-package.json
          BASE_VERSION=$(node -p "require('/tmp/base-package.json').version")
          HEAD_VERSION=$(node -p "require('./package.json').version")
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::error::guarded paths changed but package.json version is still ${HEAD_VERSION} - bump it"
            exit 1
          fi
          echo "version bumped: ${BASE_VERSION} -> ${HEAD_VERSION}"
